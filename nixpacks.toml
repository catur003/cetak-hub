# nixpacks.toml - CetakPro (Laravel 12)
#
# Dikonfirmasi dari dokumentasi resmi Coolify (coolify.io/docs/applications/laravel,
# dicek 6 Agustus 2026) - Nixpacks default provider Laravel CUMA jalanin
# php-fpm+nginx, gak ada cara built-in jalanin banyak proses (php-fpm, nginx,
# queue worker) sekaligus dalam 1 container - makanya perlu supervisor.
#
# FIX (6 Agustus 2026, KOREKSI dari dugaan sebelumnya): sempat nambahin
# "npm install"/"npm run build" manual di sini karena dikira Nixpacks gak
# jalanin build Node otomatis kalau [phases.build] di-custom. TERBUKTI SALAH
# dari build log nyata (npm run build kejalan 2x, bukan 0x) - Nixpacks
# TETAP auto-build Node/Vite meski [phases.build] di-override kayak gini.
# Baris manual itu dihapus lagi (redundant, buang ~2.5s tiap build). Akar
# masalah "CSS gak keload" yang sebenarnya: Mixed Content (APP_URL/scheme
# https, bukan soal build) - lihat AppServiceProvider.php.
#
# BEDA dari template resmi Coolify: worker QUEUE ("worker-laravel.conf")
# SENGAJA GAK DIPASANG di sini - CetakPro Phase 1 belum punya job queue
# apapun (cek: gak ada `database/migrations/*_jobs_table.php`, gak ada
# `app/Jobs/*`). Masang worker queue tanpa job yang jalan cuma buang resource
# doang di VPS yang udah pas-pasan RAM-nya (lihat temuan RAM 5 Agustus 2026).
#
# ⚠️ BELUM DITES end-to-end ke instance Coolify nyata - VERIFIKASI dulu 1x
# deploy sebelum dianggap final, terutama bagian storage/bootstrap permission
# (baris chown di start.sh).

[phases.setup]
nixPkgs = ["...", "python311Packages.supervisor"]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = '/assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/bin/bash

# Storage & bootstrap/cache WAJIB writable oleh www-data (proses php-fpm) -
# tanpa ini Laravel error pas nulis log/cache/session ke disk.
chown -R www-data:www-data /app/storage /app/bootstrap/cache
chmod -R 775 /app/storage /app/bootstrap/cache

# Transform template nginx (isi variable seperti ${PORT})
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Start supervisor -> jalanin nginx + php-fpm bareng, auto-restart kalau
# salah satu crash (bukan bikin seluruh container mati).
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.start_servers = 4
clear_env = no
php_admin_value[post_max_size] = 35M
php_admin_value[upload_max_filesize] = 30M
'''
# ^ Angka pm.* diturunin dari default resmi Coolify (yang max_children=50,
# start_servers=18) - itu disetel buat server gede, VPS testing kita cuma
# 1.9GB RAM total buat SEMUA app. Kalau nanti pindah ke VPS production yang
# speknya lebih gede, angka ini WAJIB dinaikin lagi (nyambung ke diskusi
# resource limit yang masih pending).

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Content-Type-Options "nosniff";

        client_max_body_size 35M;

        index index.php;

        charset utf-8;

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
          location / {
                try_files $uri $uri/ /index.php?$query_string;
           }
        )

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
